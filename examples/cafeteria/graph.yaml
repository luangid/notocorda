espinha:
  capability.conhecer-o-cliente:
    nome: Conhecer o cliente
    tipo: capability
    status: active
    confianca: hypothesis
    definicao: 'Capacidade de distinguir um cliente de outro ao longo do tempo e reter o que se aprendeu
      sobre ele — quem é, o que prefere, com que frequência volta. A distinção é a parte difícil: sem
      um modo de reconhecer a mesma pessoa em duas visitas, nada do que se observa numa delas se acumula.


      Não é cobrada por pedido, mas a cada reencontro: uma loja de mil clientes por dia que nunca vê o
      mesmo rosto duas vezes não precisa desta capacidade.'
    cenarios: todos
    relacoes:
    - enables → value-stage.fidelizar-cliente (Fidelizar cliente)
    recebe:
    - Programa de fidelidade (realization.programa-de-fidelidade) —realizes→ este
    arquivo: spine/capabilities/capability.conhecer-o-cliente.md
  capability.garantir-consistencia-da-bebida:
    nome: Garantir consistência da bebida
    tipo: capability
    status: active
    confianca: hypothesis
    definicao: 'Capacidade de entregar a mesma bebida em qualquer turno, com qualquer pessoa preparando.
      O que ela protege é a variação, não o nível: uma bebida sistematicamente mediana é consistente;
      uma excelente em metade dos turnos, não. A etapa que ela habilita (*Disponibilizar produto*) exige
      apenas que o produto fique pronto; é esta capacidade que exige que ele fique igual ao de ontem.


      É cobrada em cada bebida preparada e só se revela na comparação entre elas — nunca numa xícara isolada.'
    cenarios: todos
    relacoes:
    - enables → value-stage.disponibilizar-produto (Disponibilizar produto)
    recebe:
    - Insumo vencido não é utilizado (invariant.insumo-vencido-nao-utilizado) —constrains→ este
    - Padrão de preparo no balcão (realization.padrao-de-preparo-no-balcao) —realizes→ este
    arquivo: spine/capabilities/capability.garantir-consistencia-da-bebida.md
  capability.garantir-insumos:
    nome: Garantir insumos
    tipo: capability
    status: active
    confianca: hypothesis
    definicao: 'Capacidade de acertar o que comprar, quanto e quando, de modo que o insumo certo esteja
      no ponto de uso antes de a operação precisar dele. A etapa que ela habilita (*Abastecer operação*)
      é o movimento do insumo até a custódia da loja; a capacidade é o acerto da decisão que dispara esse
      movimento. Sem ela o insumo até chega — na hora errada ou na quantidade errada.


      Não acontece num momento do fluxo: é cobrada toda vez que alguém estende a mão para pegar um insumo
      e ele precisa estar lá.'
    cenarios: todos
    relacoes:
    - enables → value-stage.abastecer-operacao (Abastecer operação)
    recebe:
    - Compra semanal de insumos (realization.compra-semanal-de-insumos) —realizes→ este
    - Reposição automática de insumos (realization.reposicao-automatica-de-insumos) —realizes→ este
    - Demanda prevista (data.demanda-prevista) —measures→ este
    - Ruptura de estoque (problem.ruptura-de-estoque) —affects→ este
    arquivo: spine/capabilities/capability.garantir-insumos.md
  capability.garantir-transferencia-correta:
    nome: Garantir transferência correta
    tipo: capability
    status: active
    confianca: hypothesis
    definicao: 'Capacidade de assegurar que o produto certo chega à posse do cliente certo, qualquer que
      seja o meio de transferência — balcão, entrega, retirada ou qualquer outro ponto de coleta. A etapa
      que ela habilita (*Transferir posse ao cliente*) exige que a posse passe; é esta capacidade que
      exige que passe para quem pediu, e só para ele.


      Não se mede num pedido isolado: ela aparece quando há mais de um pedido em jogo ao mesmo tempo —
      o balcão cheio, a rota com várias entregas —, e é por isso que costuma parecer desnecessária fora
      do pico.'
    cenarios: todos
    relacoes:
    - enables → value-stage.transferir-posse-ao-cliente (Transferir posse ao cliente)
    recebe:
    - Entrega por chamada no balcão (realization.entrega-por-chamada-no-balcao) —realizes→ este
    arquivo: spine/capabilities/capability.garantir-transferencia-correta.md
  capability.gerenciar-equipe:
    nome: Gerenciar equipe
    tipo: capability
    status: active
    confianca: hypothesis
    definicao: 'Capacidade de haver, em cada turno, gente em número suficiente e treinada o bastante para
      operar — o que exige prever a necessidade, alocar quem cobre cada posição e manter as pessoas aptas
      ao longo do tempo. A etapa que ela habilita (*Preparar loja*) consome o resultado dessa capacidade
      num turno específico; a capacidade é o que faz existir alguém para escalar em todos eles.


      É cobrada antes de qualquer turno começar e outra vez a cada falta, a cada demissão e a cada bebida
      nova no cardápio.'
    cenarios: todos
    relacoes:
    - enables → value-stage.preparar-loja (Preparar loja)
    recebe:
    - Escala manual da equipe (realization.escala-manual-da-equipe) —realizes→ este
    - Dependência de uma pessoa que sabe tudo (problem.dependencia-de-uma-pessoa-que-sabe-tudo) —affects→
      este
    arquivo: spine/capabilities/capability.gerenciar-equipe.md
  capability.gerenciar-pedidos:
    nome: Gerenciar pedidos
    tipo: capability
    status: active
    confianca: hypothesis
    definicao: 'Capacidade de registrar, acompanhar e coordenar pedidos desde sua solicitação até a entrega
      ou resolução — inclusive os que terminam cancelados, trocados ou devolvidos. A etapa que ela habilita
      (*Coletar pedido*) termina no instante em que a intenção vira compromisso conhecido; a capacidade
      continua depois disso, enquanto houver pedido em aberto.


      É cobrada de forma contínua durante a operação e cresce com o número de pedidos simultâneos, não
      com o número de clientes do dia.'
    cenarios: todos
    relacoes:
    - enables → value-stage.coletar-pedido (Coletar pedido)
    recebe:
    - Pedido no balcão (realization.pedido-no-balcao) —realizes→ este
    - Pedido pelo app (realization.pedido-pelo-app) —realizes→ este
    arquivo: spine/capabilities/capability.gerenciar-pedidos.md
  capability.honrar-compromissos-financeiros:
    nome: Honrar compromissos financeiros
    tipo: capability
    status: active
    confianca: hypothesis
    definicao: 'Capacidade de liquidar as obrigações financeiras da loja — pagar fornecedores e demais
      contas devidas — no valor e no prazo acordados. Não cria a obrigação nem decide se ela existe: recebe
      o que já é devido e o leva até a quitação.


      É cobrada uma vez por obrigação em aberto, no prazo de cada uma, e não por dia de operação — o que
      a torna invisível justamente nos dias em que nada vence.'
    cenarios: todos
    recebe:
    - Caixa sempre conciliado (invariant.caixa-sempre-conciliado) —constrains→ este
    - Pagar fornecedor (obligation.pagar-fornecedor) —requires→ este
    - Pagamento ao fornecedor (realization.pagamento-ao-fornecedor) —realizes→ este
    arquivo: spine/capabilities/capability.honrar-compromissos-financeiros.md
  capability.processar-pagamentos:
    nome: Processar pagamentos
    tipo: capability
    status: active
    confianca: hypothesis
    definicao: 'Capacidade de cobrar do cliente o valor correto pelo que foi vendido e reconhecer esse
      recebimento no caixa. É o lado de contas a receber do financeiro — pagar fornecedores é a capacidade
      separada de honrar compromissos financeiros. Não fixa o momento da cobrança: à vista, na saída ou
      em fatura depois, é escolha da realização.


      É cobrada em toda venda e falha de duas maneiras opostas — cobrar a menos come a margem, cobrar
      a mais devolve o cliente para o concorrente.'
    cenarios: todos
    relacoes:
    - enables → value-stage.receber-pagamento (Receber pagamento)
    recebe:
    - Caixa sempre conciliado (invariant.caixa-sempre-conciliado) —constrains→ este
    - Pagamento na maquininha (realization.pagamento-na-maquininha) —realizes→ este
    arquivo: spine/capabilities/capability.processar-pagamentos.md
  event.entrega-de-insumos-aceita:
    nome: Entrega de insumos aceita
    tipo: event
    status: active
    confianca: hypothesis
    definicao: 'Acontecimento relevante: a loja reconhece o recebimento de insumos enviados por um fornecedor.
      O que o evento marca é o reconhecimento, não a chegada física — caixa parada na porta ainda não
      é entrega aceita, e é por isso que existe um instante identificável em que a custódia muda de lado.


      Acontece por entrega, não por pedido de compra: um pedido dividido em duas entregas produz dois
      aceites — e, portanto, duas obrigações.'
    cenarios: todos
    relacoes:
    - creates → obligation.pagar-fornecedor (Pagar fornecedor)
    recebe:
    - Abastecer operação (value-stage.abastecer-operacao) —requires→ este
    - Conferência de recebimento (realization.conferencia-de-recebimento) —realizes→ este
    arquivo: spine/events/event.entrega-de-insumos-aceita.md
  invariant.caixa-sempre-conciliado:
    nome: Caixa sempre conciliado
    tipo: invariant
    status: active
    confianca: hypothesis
    definicao: 'O que deve permanecer verdadeiro: sempre que o caixa é apurado, o que entrou e o que saiu
      conferem com o que foi registrado, sem diferença sem explicação.


      É condição, não tarefa: o invariante não manda conferir todo dia nem diz com que frequência apurar
      — só proíbe o estado em que a diferença existe e ninguém sabe de onde veio. Quando apurar é escolha
      da realização.'
    cenarios: todos
    relacoes:
    - constrains → capability.processar-pagamentos (Processar pagamentos)
    - constrains → capability.honrar-compromissos-financeiros (Honrar compromissos financeiros)
    recebe:
    - Conferência de caixa no fechamento (realization.conferencia-de-caixa-no-fechamento) —realizes→ este
    - Caixa que não fecha (problem.caixa-que-nao-fecha) —affects→ este
    arquivo: spine/invariants/invariant.caixa-sempre-conciliado.md
  invariant.insumo-vencido-nao-utilizado:
    nome: Insumo vencido não é utilizado
    tipo: invariant
    status: active
    confianca: hypothesis
    definicao: 'O que deve permanecer verdadeiro: nenhum insumo fora da validade entra na produção de
      uma bebida.


      É condição, não tarefa: não obriga a conferir a prateleira todo turno nem a etiquetar nada — obriga
      apenas que o insumo vencido não chegue à bebida. Como impedir isso é escolha da realização, e uma
      realização que descarta cedo demais cumpre o invariante desperdiçando.'
    cenarios: todos
    relacoes:
    - constrains → capability.garantir-consistencia-da-bebida (Garantir consistência da bebida)
    recebe:
    - Controle de validade na prateleira (realization.controle-de-validade-na-prateleira) —realizes→ este
    - Perda por validade (problem.perda-por-validade) —affects→ este
    arquivo: spine/invariants/invariant.insumo-vencido-nao-utilizado.md
  objective.servir-cafe-rentavel:
    nome: Servir café com qualidade e margem
    tipo: objective
    status: active
    confianca: hypothesis
    definicao: 'Resultado desejado: cada bebida servida está dentro do padrão da casa e o conjunto delas
      deixa margem suficiente para sustentar o negócio no longo prazo. São duas condições que só valem
      juntas — bebida boa que não paga a conta e conta paga com bebida ruim falham igualmente o objetivo.


      Não é um acontecimento e por isso não tem cadência própria: é condição que se verifica por período
      — o mês, o ano —, somando o que as etapas produziram uma a uma.'
    cenarios: todos
    recebe:
    - Fidelizar cliente (value-stage.fidelizar-cliente) —advances→ este
    arquivo: spine/objectives/objective.servir-cafe-rentavel.md
  obligation.pagar-fornecedor:
    nome: Pagar fornecedor
    tipo: obligation
    status: active
    confianca: hypothesis
    definicao: 'O que se torna devido: a contraprestação financeira criada quando a loja aceita uma entrega
      de insumos. A obrigação não é o ato de pagar — é o estado que existe entre o aceite que a cria e
      a quitação que a extingue, e existe mesmo que ninguém a tenha anotado em lugar nenhum.


      Nasce por entrega aceita e se extingue uma vez cada, na quitação. Quem lhe dá data é o prazo negociado
      com o fornecedor, não o calendário da loja.'
    cenarios: todos
    relacoes:
    - requires → capability.honrar-compromissos-financeiros (Honrar compromissos financeiros)
    recebe:
    - Entrega de insumos aceita (event.entrega-de-insumos-aceita) —creates→ este
    arquivo: spine/obligations/obligation.pagar-fornecedor.md
  value-stage.abastecer-operacao:
    nome: Abastecer operação
    tipo: value-stage
    status: active
    confianca: hypothesis
    definicao: 'Transformação necessária: o que era estoque de um fornecedor passa a ser insumo sob custódia
      da operação, na quantidade e na condição de uso que os próximos dias exigem. Termina quando o insumo
      está disponível para consumo; decidir o que comprar e quanto é da capacidade que habilita esta etapa,
      não dela.


      Acontece por ciclo de reposição — semanal, diário ou contínuo, conforme o modelo —, nunca por cliente
      atendido.'
    cenarios: todos
    relacoes:
    - advances → value-stage.preparar-loja (Preparar loja)
    - requires → event.entrega-de-insumos-aceita (Entrega de insumos aceita)
    recebe:
    - Garantir insumos (capability.garantir-insumos) —enables→ este
    - Loja única com estoque local (realization.loja-unica-com-estoque-local) —realizes→ este
    arquivo: spine/value-stages/value-stage.abastecer-operacao.md
  value-stage.coletar-pedido:
    nome: Coletar pedido
    tipo: value-stage
    status: active
    confianca: hypothesis
    definicao: 'Transformação necessária: a intenção de compra do cliente é capturada de forma acionável,
      qualquer que seja o canal — balcão, totem, aplicativo ou qualquer outro meio ainda não inventado.
      Termina quando o pedido existe como objeto para as etapas seguintes; acompanhá-lo dali em diante
      é da capacidade que habilita esta etapa, não dela.


      Acontece uma vez por pedido: é o ato que faz o pedido passar a existir.'
    cenarios: todos
    relacoes:
    - advances → value-stage.disponibilizar-produto (Disponibilizar produto)
    recebe:
    - Gerenciar pedidos (capability.gerenciar-pedidos) —enables→ este
    - Preparar loja (value-stage.preparar-loja) —advances→ este
    - Registro manual de pedidos (data.registro-manual-de-pedidos) —records→ este
    - Fila no horário de pico (problem.fila-no-horario-de-pico) —affects→ este
    arquivo: spine/value-stages/value-stage.coletar-pedido.md
  value-stage.disponibilizar-produto:
    nome: Disponibilizar produto
    tipo: value-stage
    status: active
    confianca: hypothesis
    definicao: 'Transformação necessária: o produto do pedido fica pronto para ser passado ao cliente
      — seja produzido na hora, montado a partir de insumos, ou obtido já pronto, por exemplo comprado
      de terceiros para revenda. Termina com o produto pronto; que ele saia igual ao de ontem é da capacidade
      que habilita esta etapa, não dela.


      Acontece por item do pedido: um pedido com dois cafés e um pão passa três vezes por esta etapa e
      uma só pela seguinte.'
    cenarios: todos
    relacoes:
    - advances → value-stage.transferir-posse-ao-cliente (Transferir posse ao cliente)
    recebe:
    - Garantir consistência da bebida (capability.garantir-consistencia-da-bebida) —enables→ este
    - Coletar pedido (value-stage.coletar-pedido) —advances→ este
    arquivo: spine/value-stages/value-stage.disponibilizar-produto.md
  value-stage.fidelizar-cliente:
    nome: Fidelizar cliente
    tipo: value-stage
    status: active
    confianca: hypothesis
    definicao: 'Transformação necessária: quem comprou uma vez passa a ter razão para voltar e, no limite,
      para trazer outras pessoas. O que se transforma aqui é o vínculo, não o produto — nada muda na bebida,
      muda a probabilidade da próxima visita.


      É a única etapa cuja cadência não é a do pedido: acontece por cliente, acumulando-se ao longo de
      muitas passagens pelas etapas anteriores, e por isso não se conclui dentro de um dia de operação.'
    cenarios: todos
    relacoes:
    - advances → objective.servir-cafe-rentavel (Servir café com qualidade e margem)
    recebe:
    - Conhecer o cliente (capability.conhecer-o-cliente) —enables→ este
    - Receber pagamento (value-stage.receber-pagamento) —advances→ este
    - Programa de fidelidade (realization.programa-de-fidelidade) —realizes→ este
    arquivo: spine/value-stages/value-stage.fidelizar-cliente.md
  value-stage.preparar-loja:
    nome: Preparar loja
    tipo: value-stage
    status: active
    confianca: hypothesis
    definicao: 'Transformação necessária: o posto de operação passa de parado a apto a atender — instalação
      em condição de higiene e funcionamento, insumos ao alcance da mão e gente escalada e presente. Termina
      antes do primeiro cliente; ter as pessoas certas e treinadas para escalar é da capacidade que habilita
      esta etapa, não dela.


      Acontece por turno, não por dia: numa operação de dois turnos, a etapa acontece duas vezes.'
    cenarios: todos
    relacoes:
    - advances → value-stage.coletar-pedido (Coletar pedido)
    recebe:
    - Gerenciar equipe (capability.gerenciar-equipe) —enables→ este
    - Abastecer operação (value-stage.abastecer-operacao) —advances→ este
    - Abertura e fechamento da loja (realization.abertura-e-fechamento-da-loja) —realizes→ este
    - Limpeza de fim de turno (realization.limpeza-de-fim-de-turno) —realizes→ este
    arquivo: spine/value-stages/value-stage.preparar-loja.md
  value-stage.receber-pagamento:
    nome: Receber pagamento
    tipo: value-stage
    status: active
    confianca: hypothesis
    definicao: 'Transformação necessária: o valor devido pelo pedido sai do cliente e entra reconhecido
      no caixa da operação. São dois movimentos que a etapa exige juntos — o dinheiro muda de mãos e o
      recebimento passa a constar de onde a operação lê seu resultado. Um sem o outro deixa a etapa pela
      metade: dinheiro na gaveta que ninguém registrou não virou receita reconhecida.


      Acontece uma vez por pedido, mesmo quando o cliente divide o valor em duas formas de pagamento.'
    cenarios: todos
    relacoes:
    - advances → value-stage.fidelizar-cliente (Fidelizar cliente)
    recebe:
    - Processar pagamentos (capability.processar-pagamentos) —enables→ este
    - Transferir posse ao cliente (value-stage.transferir-posse-ao-cliente) —advances→ este
    - Histórico de vendas (data.historico-de-vendas) —records→ este
    - Planilha de vendas (data.planilha-de-vendas) —records→ este
    arquivo: spine/value-stages/value-stage.receber-pagamento.md
  value-stage.transferir-posse-ao-cliente:
    nome: Transferir posse ao cliente
    tipo: value-stage
    status: active
    confianca: hypothesis
    definicao: 'Transformação necessária: a posse do produto passa para o cliente certo — por entrega,
      retirada no balcão, coleta em um ponto de encontro ou qualquer outro meio. Termina quando o produto
      está com quem o pediu; assegurar que seja o cliente certo é da capacidade que habilita esta etapa,
      não dela.


      Acontece por pedido, e não por item: os três itens de um mesmo pedido mudam de posse numa entrega
      só.'
    cenarios: todos
    relacoes:
    - advances → value-stage.receber-pagamento (Receber pagamento)
    recebe:
    - Garantir transferência correta (capability.garantir-transferencia-correta) —enables→ este
    - Disponibilizar produto (value-stage.disponibilizar-produto) —advances→ este
    arquivo: spine/value-stages/value-stage.transferir-posse-ao-cliente.md
realizacoes:
  realization.abertura-e-fechamento-da-loja:
    nome: Abertura e fechamento da loja
    status: active
    confianca: hypothesis
    definicao: Checklist impresso, fixado atrás do balcão, com os passos de abertura (ligar equipamentos,
      conferir estoque de leite e copos, montar o caixa) e de fechamento (limpar máquinas, guardar insumos
      perecíveis, conferir caixa). Cada turno assina a linha correspondente.
    cenarios:
    - scenario.loja-unica (As-Is · Loja única)
    - scenario.loja-inteligente (Loja inteligente)
    areas:
    - area.operacoes (Operações)
    relacoes:
    - realizes → value-stage.preparar-loja (Preparar loja)
    arquivo: realizations/realization.abertura-e-fechamento-da-loja.md
  realization.compra-semanal-de-insumos:
    nome: Compra semanal de insumos
    status: active
    confianca: hypothesis
    definicao: Compra de insumos feita uma vez por semana, geralmente às segundas, por estimativa da gerente
      — sem previsão formal de demanda. Parte dos itens é comprada no atacadista da região, parte é pedida
      diretamente a fornecedores habituais.
    cenarios:
    - scenario.loja-unica (As-Is · Loja única)
    areas:
    - area.suprimentos (Suprimentos)
    relacoes:
    - realizes → capability.garantir-insumos (Garantir insumos)
    recebe:
    - Reposição automática de insumos (realization.reposicao-automatica-de-insumos) —replaces→ este
    - Grupo de WhatsApp com fornecedor (system.grupo-whatsapp-fornecedor) —supports→ este
    - Ruptura de estoque (problem.ruptura-de-estoque) —affects→ este
